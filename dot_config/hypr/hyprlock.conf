# hyprlock.conf — Tokyo Night style matching wlogout

background {
    monitor =
    path = screenshot
    # match window { background-color: rgba(21,25,43,0.8) }
    color = rgba(21, 25, 43, 0.8)
    blur_passes = 2
}

# Date (white text)
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B')" </b>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 18
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, -120
    halign = center
    valign = center
}

# Hour (primary orange highlight)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    # match button:focus { background-color: rgba(255,158,100,1) }
    color = rgba(255, 158, 100, 0.8)
    font_size = 240
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, -100
    halign = center
    valign = top
}

# Minute (white text)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 240
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, -450
    halign = center
    valign = top
}

# Seconds (white text, smaller)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%S")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 50
    font_family = CaskaydiaCove Nerd Font Mono
    position = 0, -425
    halign = center
    valign = top
}

# INPUT FIELD (navy outline, orange accent, white text)
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2    # relative to height
    dots_spacing = 0.2 # relative
    dots_center = true

    # outer border matching the primary orange accent
    outer_color = rgba(255, 158, 100, 0.8)
    # subtle translucent inner fill
    inner_color = rgba(255, 255, 255, 0.1)

    # input text and dots in white
    font_color    = rgba(255, 255, 255, 1.0)
    capslock_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    font_family   = CaskaydiaCove Nerd Font Mono Oblique
    # placeholder in semi-transparent white
    placeholder_text = <i><span foreground="##ffffff99">   Password</span></i>

    hide_input = false
    position = 0, -200
    halign   = center
    valign   = center
}

